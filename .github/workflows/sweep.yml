name: ArmTune sweep (arm64)

# Runs the full quantize -> benchmark -> report pipeline on a real Arm64
# server CPU using GitHub's free hosted arm64 runners (Azure Cobalt 100,
# Neoverse-based) - no cloud account, no credit card, just a public repo.
# See: https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "Hugging Face repo containing the base f16 GGUF"
        default: "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
        required: false
      hf_file:
        description: "GGUF filename within that repo"
        default: "qwen2.5-0.5b-instruct-fp16.gguf"
        required: false
  push:
    branches: [main]

jobs:
  sweep:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this is real Arm64 server silicon
        run: |
          uname -m
          cat /proc/cpuinfo | head -30
          lscpu || true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make cmake gcc g++ build-essential python3-pip python3-venv

      - name: Cache llama.cpp build
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ runner.os }}-arm64-${{ hashFiles('.github/workflows/sweep.yml') }}

      - name: Build llama.cpp (-mcpu=native)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. -DCMAKE_CXX_FLAGS="-mcpu=native" -DCMAKE_C_FLAGS="-mcpu=native"
          cmake --build . -v --config Release -j "$(nproc)"

      - name: Show Arm kernel support banner
        run: |
          ./llama.cpp/build/bin/llama-cli --version
          echo "Look for NEON/MATMUL_INT8/SVE=1 below once a model is loaded (next step)."

      - name: Install armtune
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip -q
          pip install -e . -q
          pip install huggingface_hub -q

      - name: Download base model
        run: |
          source .venv/bin/activate
          mkdir -p models
          huggingface-cli download "${{ inputs.hf_repo || 'Qwen/Qwen2.5-0.5B-Instruct-GGUF' }}" \
            "${{ inputs.hf_file || 'qwen2.5-0.5b-instruct-fp16.gguf' }}" \
            --local-dir models --local-dir-use-symlinks False

      - name: Run armtune sweep
        run: |
          source .venv/bin/activate
          armtune sweep \
            --base-model "models/${{ inputs.hf_file || 'qwen2.5-0.5b-instruct-fp16.gguf' }}" \
            --llama-bin-dir llama.cpp/build/bin \
            --quants Q4_0,Q4_K_M,Q8_0 \
            --threads 1,2,4 \
            --batch 512,1024 \
            --n-prompt 256 \
            --n-gen 64 \
            --repetitions 2 \
            --out-dir results

      - name: Publish report to job summary
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: armtune-results
          path: results/
